<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Gaya tulisan */
    body { font-family: 'Quicksand', sans-serif; }
    h1 { font-family: 'Pacifico', cursive; font-weight: 400; }
    input, textarea, button { font-family: 'Quicksand', sans-serif; }

    /* Background love-love pink soft */
    body {
      background-color: #fdf2f8;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path transform='translate(19.2 19.2) scale(0.4)' fill='%23f9c6dd' fill-opacity='0.6' d='M12 21s-7-4.5-9.5-9C1 9 2.5 5.5 6 5.5c2 0 3.5 1 6 3.5 2.5-2.5 4-3.5 6-3.5 3.5 0 5 3.5 3.5 6.5-2.5 4.5-9.5 9-9.5 9z'/></svg>"), url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path transform='translate(19.8 19.8) scale(0.35)' fill='%23fbcfe8' fill-opacity='0.9' d='M12 21s-7-4.5-9.5-9C1 9 2.5 5.5 6 5.5c2 0 3.5 1 6 3.5 2.5-2.5 4-3.5 6-3.5 3.5 0 5 3.5 3.5 6.5-2.5 4.5-9.5 9-9.5 9z'/></svg>"), url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path transform='translate(20.4 20.4) scale(0.3)' fill='%23f4b6d2' fill-opacity='0.45' d='M12 21s-7-4.5-9.5-9C1 9 2.5 5.5 6 5.5c2 0 3.5 1 6 3.5 2.5-2.5 4-3.5 6-3.5 3.5 0 5 3.5 3.5 6.5-2.5 4.5-9.5 9-9.5 9z'/></svg>");
      background-size: 80px 80px, 120px 120px, 70px 70px;
      background-position: 0 0, 50px 40px, 30px 55px;
      background-repeat: repeat;
    }
  </style>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-4">

  <form id="formRegister" action="dashboard.html" novalidate
        class="bg-white w-full max-w-md p-6 rounded-2xl shadow-lg border border-pink-100 space-y-4">

    <h1 class="text-2xl text-center text-pink-500">Form Register</h1>

    <!-- Username -->
    <div>
      <label for="username" class="block mb-1 font-medium text-pink-700">Username</label>
      <input type="text" id="username" name="username"
             class="w-full border border-pink-200 bg-pink-50 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-300 focus:bg-white">
      <p id="errorUsername" class="text-rose-500 text-sm mt-1"></p>
    </div>

    <!-- Password -->
    <div>
      <label for="password" class="block mb-1 font-medium text-pink-700">Password</label>
      <input type="password" id="password"
             class="w-full border border-pink-200 bg-pink-50 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-300 focus:bg-white">
      <p id="errorPassword" class="text-rose-500 text-sm mt-1"></p>
    </div>

    <!-- Nama -->
    <div>
      <label for="nama" class="block mb-1 font-medium text-pink-700">Nama</label>
      <input type="text" id="nama" name="nama"
             class="w-full border border-pink-200 bg-pink-50 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-300 focus:bg-white">
      <p id="errorNama" class="text-rose-500 text-sm mt-1"></p>
    </div>

    <!-- Tanggal Lahir -->
    <div>
      <label for="tanggalLahir" class="block mb-1 font-medium text-pink-700">Tanggal Lahir</label>
      <input type="date" id="tanggalLahir" name="tanggalLahir"
             class="w-full border border-pink-200 bg-pink-50 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-300 focus:bg-white">
      <p id="errorTanggalLahir" class="text-rose-500 text-sm mt-1"></p>
    </div>

    <!-- Alamat -->
    <div>
      <label for="alamat" class="block mb-1 font-medium text-pink-700">Alamat</label>
      <textarea id="alamat" name="alamat" rows="3"
                class="w-full border border-pink-200 bg-pink-50 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-300 focus:bg-white"></textarea>
      <p id="errorAlamat" class="text-rose-500 text-sm mt-1"></p>
    </div>

    <!-- Nomor Telepon -->
    <div>
      <label for="telepon" class="block mb-1 font-medium text-pink-700">Nomor Telepon</label>
      <div class="flex">
        <span class="inline-flex items-center px-3 border border-r-0 border-pink-200 bg-pink-100 text-pink-700 font-semibold rounded-l-lg">+62</span>
        <input type="text" id="telepon" inputmode="numeric" placeholder="81234567890"
               class="w-full border border-pink-200 bg-pink-50 rounded-r-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-300 focus:bg-white">
      </div>
      <!-- Kotak tersembunyi: menyimpan nomor lengkap (62 + nomor) untuk dikirim -->
      <input type="hidden" id="teleponLengkap" name="telepon">
      <p id="errorTelepon" class="text-rose-500 text-sm mt-1"></p>
    </div>

    <button type="submit"
            class="w-full bg-pink-400 text-white font-semibold py-2 rounded-lg hover:bg-pink-500 transition">
      Daftar
    </button>
  </form>

  <script src="validasi_input.js"></script>
</body>
</html>
